- Class: text
  Output: This is Rosling's chart for one year. Four columns of the table are on the page at once, as position, position, colour and size. Each was a choice, and each choice is a claim about what matters.
- Class: text
  Output: So far, one year. Whether the picture changed is the question that matters for policy. A second panel beside the first is the grammar's way to compare, and it needs two years in one table.
- Class: cmd_question
  Output: Keep two years, 1962 and 2007, in a new object called g2. filter() again, but a row is kept when its year is in a list of two, and the operator for that is %in%, so the condition reads year %in% c(1962, 2007). Write the whole line yourself.
  CorrectAnswer: g2 <- filter(gapminder, year %in% c(1962, 2007))
  AnswerTests: any_of_exprs('g2 <- filter(gapminder, year %in% c(1962, 2007))', 'g2 <- gapminder %>% filter(year %in% c(1962, 2007))', 'g2 <- filter(gapminder, year == 1962 | year == 2007)', 'g2 <- gapminder |> filter(year %in% c(1962, 2007))')
  Hint: g2 <- filter(gapminder, year %in% c(1962, 2007)) with %in% between year and c(...).
- Class: text
  Output: The layer that does this is facet_wrap(). A facet is one panel. facet_wrap() draws the whole plot once for every value in a column, side by side, with the same axes in each panel. It is written with a tilde, the ~ key, in front of the column name, facet_wrap(~ year), which reads as panels by year. It goes on the end with another plus sign, like any layer.
