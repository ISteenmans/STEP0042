- Class: text
  Output: Two panels, same axes, so the comparison is fair. By 2007 the cloud has moved up and to the right. On the averages, life expectancy in Africa went from 43.3 to 54.8 years, in Asia from 51.6 to 70.7, in Europe from 68.5 to 77.6. Asia closed most of its gap with Europe; Africa closed less of it. Whether the world got healthier as it got richer, and for whom, is a reading, and the chart is your evidence for it.
- Class: text
  Output: That is the grammar's way of adding a variable without adding an aesthetic. Colour put continent on the page; the facet put year on the page; and it turned a description into a comparison.
