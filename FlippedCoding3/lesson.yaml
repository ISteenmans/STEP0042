- Class: text
  Output: 'In this lesson you draw graphs from data in R with ggplot2, a package written by Hadley Wickham. It is built on an idea called the grammar of graphics, from Leland Wilkinson: every graph, however elaborate, is made from the same few parts. Learn the parts once and you can build any graph. This is the grammar from Sessions 13 and 14, one step at a time, at your own pace.'
- Class: text
  Output: The data is the gapminder table we used in class. It comes from the Gapminder Foundation, the Swedish organisation behind Hans Rosling's moving bubble charts of health and wealth, packaged for R by Jenny Bryan. 142 countries, every five years from 1952 to 2007, with life expectancy, population and GDP per person for each.
- Class: text
  Output: One rule for this lesson. Most steps describe what to do and name the pieces; they do not show you the finished line. Write it yourself. A wrong attempt gets you a hint with more detail; after a second wrong attempt you can type skip() to see the answer and move on. The point is the writing, not the copying.
- Class: text
  Output: At the end you will save a picture file, and R saves into one folder at a time, the working directory. Set it first, with the mouse, in the Files pane at the bottom right. Browse to your STEP0042 folder, open it, then click the cog and choose Set As Working Directory.
- Class: cmd_question
  Output: Do that now. RStudio types a setwd() command into the console for you. That command is the answer to this step, so do it even if you think you are already in the right place.
  CorrectAnswer: setwd("the path to your STEP0042 folder")
  AnswerTests: expr_uses_func("setwd")
  Hint: Files pane, bottom right. Browse to your STEP0042 folder, open it, then the cog, then Set As Working Directory. Or type it yourself, for example setwd("~/Documents/STEP0042"), with your own folder name in the quotes.
- Class: cmd_question
  Output: Check it. Ask R where it is working. The answer is the path to your folder.
  CorrectAnswer: getwd()
  AnswerTests: omnitest(correctExpr='getwd()')
  Hint: Type getwd() with nothing inside the brackets.
- Class: cmd_question
  Output: Load the tidyverse, the first line of every script this term. The Conflicts block that prints is a notice, not an error.
  CorrectAnswer: library(tidyverse)
  AnswerTests: any_of_exprs('library(tidyverse)', 'library(ggplot2)')
  Hint: Type library(tidyverse) exactly like that.
- Class: cmd_question
  Output: Now load the gapminder package. It holds the table, so there is no file to read in. If R says there is no package called gapminder, type install.packages("gapminder") first, then this line again.
  CorrectAnswer: library(gapminder)
  AnswerTests: omnitest(correctExpr='library(gapminder)')
  Hint: Type library(gapminder). If it is not installed, install.packages("gapminder") first.
- Class: cmd_question
  Output: See the column names. You know the function; the table name, gapminder, goes inside the brackets.
  CorrectAnswer: names(gapminder)
  AnswerTests: omnitest(correctExpr='names(gapminder)')
  Hint: names(gapminder)
- Class: text
  Output: Six columns. country and continent are words. year runs from 1952 to 2007 in steps of five. lifeExp is life expectancy at birth, in years. pop is people. gdpPercap is GDP per person, in US dollars adjusted for inflation. One row is one country in one year.
- Class: cmd_question
  Output: Look at the first six rows.
  CorrectAnswer: head(gapminder)
  AnswerTests: omnitest(correctExpr='head(gapminder)')
  Hint: head(gapminder), the table name inside the brackets.
- Class: text
  Output: Afghanistan, 1952 to 1977. The table is sorted by country, then year, so head() shows you one country. Afghanistan's life expectancy in 1952 was 28.8 years.
- Class: text
  Output: 'The question for this lesson is the one from Session 13: did the world get healthier as it got richer? To look at one moment, you need one year, and that is a dplyr job before it is a graph job.'
- Class: cmd_question
  Output: Keep the 1962 rows only, in a new object called g1962. You met the verb for keeping rows in Session 7; a comparison takes two equals signs. Have a go before you look at the hint.
  CorrectAnswer: g1962 <- filter(gapminder, year == 1962)
  AnswerTests: any_of_exprs('g1962 <- filter(gapminder, year == 1962)', 'g1962 <- gapminder %>% filter(year == 1962)', 'g1962 <- filter(gapminder, year == 1962L)', 'g1962 <- gapminder |> filter(year == 1962)')
  Hint: g1962 <- filter(gapminder, year == 1962) with a double equals sign.
- Class: cmd_question
  Output: Check its size.
  CorrectAnswer: dim(g1962)
  AnswerTests: omnitest(correctExpr='dim(g1962)')
  Hint: dim(g1962), the new table's name inside the brackets.
- Class: text
  Output: 142 rows and 6 columns, one row per country. Every graph in the next ten minutes is a picture of this table.
- Class: text
  Output: The grammar. Every graph answers three questions. Which table is it drawn from (the data)? Which column goes to which visual property, such as the horizontal position, the vertical position, the colour, the size (the mapping, from variables to aesthetics)? And what mark is drawn for each row, a point, a line, a bar (the geom)? ggplot2 asks you exactly those three things, in that order.
- Class: text
  Output: The template is ggplot(data, aes(mapping)) + geom_something(). ggplot() names the data and draws nothing. aes() holds the mapping. The geom draws. The parts are joined with a plus sign, not with the pipe. Type the whole thing on one line in this lesson.
- Class: cmd_question
  Output: Draw it. Fill the template in. The data is g1962; inside aes(), x = gdpPercap and y = lifeExp; the geom is geom_point(). Write the line, press Enter, and look at the Plots pane.
  CorrectAnswer: ggplot(g1962, aes(x = gdpPercap, y = lifeExp)) + geom_point()
  AnswerTests: any_of_exprs('ggplot(g1962, aes(x = gdpPercap, y = lifeExp)) + geom_point()', 'ggplot(data = g1962, mapping = aes(x = gdpPercap, y = lifeExp)) + geom_point()', 'ggplot(g1962, mapping = aes(x = gdpPercap, y = lifeExp)) + geom_point()', 'ggplot(data = g1962, aes(x = gdpPercap, y = lifeExp)) + geom_point()', 'ggplot(g1962, aes(gdpPercap, lifeExp)) + geom_point()', 'ggplot(data = g1962, mapping = aes(gdpPercap, lifeExp)) + geom_point()', 'ggplot(g1962, mapping = aes(gdpPercap, lifeExp)) + geom_point()', 'ggplot(data = g1962, aes(gdpPercap, lifeExp)) + geom_point()')
  Hint: ggplot(g1962, aes(x = gdpPercap, y = lifeExp)) + geom_point() with a plus sign before geom_point.
- Class: text
  Output: '142 points, one per country. Read it before you believe it. One point sits on its own far to the right: Kuwait, at 95,458 dollars a head, with a life expectancy of 60.5 years. Everyone else is squashed into the left-hand tenth of the chart. The lowest point is Afghanistan, at 32 years; the highest is Iceland, at 73.7.'
- Class: cmd_question
  Output: Now see what each part does by leaving one out. Write the same line without the geom, so it ends at the closing bracket of aes().
  CorrectAnswer: ggplot(g1962, aes(x = gdpPercap, y = lifeExp))
  AnswerTests: any_of_exprs('ggplot(g1962, aes(x = gdpPercap, y = lifeExp))', 'ggplot(data = g1962, mapping = aes(x = gdpPercap, y = lifeExp))', 'ggplot(g1962, mapping = aes(x = gdpPercap, y = lifeExp))', 'ggplot(data = g1962, aes(x = gdpPercap, y = lifeExp))', 'ggplot(g1962, aes(gdpPercap, lifeExp))', 'ggplot(data = g1962, mapping = aes(gdpPercap, lifeExp))', 'ggplot(g1962, mapping = aes(gdpPercap, lifeExp))', 'ggplot(data = g1962, aes(gdpPercap, lifeExp))')
  Hint: The same command as before, without the + geom_point() at the end.
- Class: text
  Output: Axes, a grid, the right ranges, and nothing drawn. ggplot() and aes() set up the frame; the geom puts the marks in it. That is the whole grammar in one blank picture. Each plus sign adds a layer on top of what is there.
- Class: text
  Output: 'The squashed chart is a scale problem. Income differences are multiplicative: a country going from 500 to 1,000 dollars has doubled, as has one going from 10,000 to 20,000. A log scale gives each doubling the same width.'
- Class: cmd_question
  Output: 'Draw the first plot again and add one more layer after another plus sign: scale_x_log10(), with nothing in its brackets.'
  CorrectAnswer: ggplot(g1962, aes(x = gdpPercap, y = lifeExp)) + geom_point() + scale_x_log10()
  AnswerTests: any_of_exprs('ggplot(g1962, aes(x = gdpPercap, y = lifeExp)) + geom_point() + scale_x_log10()', 'ggplot(data = g1962, mapping = aes(x = gdpPercap, y = lifeExp)) + geom_point() + scale_x_log10()', 'ggplot(g1962, mapping = aes(x = gdpPercap, y = lifeExp)) + geom_point() + scale_x_log10()', 'ggplot(data = g1962, aes(x = gdpPercap, y = lifeExp)) + geom_point() + scale_x_log10()', 'ggplot(g1962, aes(gdpPercap, lifeExp)) + geom_point() + scale_x_log10()', 'ggplot(data = g1962, mapping = aes(gdpPercap, lifeExp)) + geom_point() + scale_x_log10()', 'ggplot(g1962, mapping = aes(gdpPercap, lifeExp)) + geom_point() + scale_x_log10()', 'ggplot(data = g1962, aes(gdpPercap, lifeExp)) + geom_point() + scale_x_log10()')
  Hint: The first plot with + scale_x_log10() on the end.
- Class: text
  Output: 'The same 142 points, now spread across the page, and a rising cloud appears: richer countries tend to live longer. Kuwait is still on the right, now as one country among many. Neither chart is the true one. The linear one shows how far Kuwait was from everyone; the log one shows the pattern among the rest. The scale decided what you could see.'
- Class: text
  Output: The plot still cannot say who is who. The grammar's answer is to map another column to another aesthetic. Colour is the usual choice for a column of categories, and continent is one.
