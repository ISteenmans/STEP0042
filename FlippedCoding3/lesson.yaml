- Class: text
  Output: The moves. filter() to get the table you want, then ggplot() to name it, aes() to map columns to position, colour and size, a geom to choose the mark, a scale to decide how distance is read, a plus sign for every layer, facet_wrap() to compare panels, labs() to speak to the reader, ggsave() to keep it. Every chart in Task 3 is those moves in some order.
- Class: text
  Output: 'In the module''s words. The mapping is the frame: it decides what the chart can see at all. The geom is the shape of the claim: points, a line, panels. The scale decides which differences look big. The title and labels are for the reader, who was not in the room. Change any of them and the same table says something else.'
